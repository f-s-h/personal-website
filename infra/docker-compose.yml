services:

  web-client:
    container_name: web-client
    build: ../web-client
    expose:
      - 80
    networks:
      - app
    depends_on:
      - tunnel

  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app

networks:
  app:
